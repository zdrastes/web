[pytest]
pythonpath = .
testpaths = tests
# Покрытие для CI-джобы coverage шаблона (devops/ci/templates): она ждёт coverage.txt
# и загружает артефакт coverage.xml. Терм-отчёт pytest-cov в файл не пишется, поэтому
# coverage.txt собирается markdown-отчётом (таблица с TOTAL %), xml — стандартным отчётом.
addopts =
    --cov=app
    --cov-report=term-missing
    --cov-report=markdown:coverage.txt
    --cov-report=xml:coverage.xml
