<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; script-src 'self' 'unsafe-inline'; base-uri 'none'; form-action 'none'">
  <title>Задачи проекта · Портал L2</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <style>
    :root{font:14px Inter,system-ui,sans-serif;color:#1C1E21;background:#F3F5F8;--muted:#7A828E;--soft:#F0F2F5}
    *{box-sizing:border-box}[hidden]{display:none!important}body{margin:0}
    .shell{width:min(1120px,calc(100% - 48px));margin-inline:auto}
    header{display:flex;justify-content:space-between;align-items:center;padding:16px 0;border-bottom:1px solid #e4e8ed}
    header a,.back{color:inherit;text-decoration:none;font-weight:600}header a{display:flex;align-items:center;gap:10px}
    .mark{display:grid;place-items:center;width:34px;height:34px;border-radius:11px;background:#eae4fb;color:#563c99}
    header span:last-child,.muted{color:var(--muted);font-size:13px}
    main{padding:24px 0 48px}.back{display:inline-block;margin-bottom:16px;color:#54447d}
    h1{font-size:28px;font-weight:700;margin:0 0 6px;letter-spacing:-.035em}
    h2{font-size:18px;font-weight:600;margin:0;letter-spacing:-.022em}
    .subtitle{margin:0 0 16px}
    .task-views{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 16px}
    .task-views button,#task-employee{border:1px solid #e5e0ee;border-radius:12px;padding:9px 12px;background:#fff;color:#1C1E21;font:inherit}
    .task-views button{cursor:pointer}
    .task-views button[aria-pressed=true]{background:#e9e2f8;color:#513886;font-weight:650}
    .task-views button:focus-visible,#task-employee:focus-visible{outline:2px solid #765bb6;outline-offset:2px}
    #task-employee-field{display:flex;align-items:center;gap:8px;margin-bottom:16px;flex-wrap:wrap}
    .bento{display:grid;grid-template-columns:minmax(0,1fr) minmax(230px,268px);grid-template-areas:"tasks metrics" "tasks distribution";grid-template-rows:auto 1fr;align-items:start;gap:16px}
    .card{position:relative;min-width:0;background:#FFFFFF;border-radius:20px;box-shadow:0 2px 12px rgba(16,24,40,.03);padding:20px}
    .metrics{grid-area:metrics}.distribution{grid-area:distribution;padding:14px}.distribution h2{font-size:16px}
    .tasks{grid-area:tasks}.card-icon{position:absolute;right:14px;top:14px;width:34px;height:34px}
    .metrics h2{padding-right:34px}
    .metrics dl{display:grid;gap:7px;margin:14px 0 0}
    .metrics dl div{display:flex;justify-content:space-between;gap:10px;padding-bottom:7px;border-bottom:1px solid #f0f2f5}
    .metrics dt{color:var(--muted);font-size:13px;line-height:1.5}.metrics dd{margin:0;font-weight:700;white-space:nowrap}
    .status-chart{display:grid;gap:6px;margin:9px 0 0}
    .status-row{display:grid;grid-template-columns:minmax(122px,1.8fr) minmax(25px,1fr) 2ch;align-items:center;gap:7px;font-size:12px}
    .status-track{height:6px;border-radius:999px;background:#e7eaf0;overflow:hidden}
    .status-fill{height:100%;border-radius:inherit;background:var(--status-accent)}
    .table-scroll{max-width:100%;overflow-x:auto}
    .reason-table{width:100%;min-width:530px;border-collapse:collapse;text-align:left}
    .reason-table th,.reason-table td{padding:11px 8px;border-bottom:1px solid #F1F3F6}
    .reset-filter{display:grid;place-items:center;width:27px;height:27px;border:0;border-radius:8px;background:#F0F2F5;color:#584287;cursor:pointer}
    .reset-filter:disabled{color:#8b829e;cursor:default;opacity:.56}
    .reset-filter:hover:not(:disabled){background:#e9e2fa}
    .reset-filter:focus-visible{outline:2px solid #765bb6;outline-offset:2px}
    .reason-table .filter-cell{width:1%;padding-inline:4px}
    .sort-column{display:inline-flex;align-items:center;gap:5px;padding:4px 0;background:none;color:inherit;border:0;font:inherit;font-weight:650;cursor:pointer}
    .sort-column span{color:#765bb6}
    .sort-column:hover{color:#513886}
    .sort-column:focus-visible{outline:2px solid #765bb6;outline-offset:3px}
    .reason-table th{font-size:13px;white-space:nowrap;color:#575e6b}
    .reason-table tbody th{color:#1C1E21;white-space:normal}
    .status-label,.task-tag{display:inline-block;max-width:100%;border-radius:999px;font-size:12px;padding:5px 8px}
    .reason-table th:nth-child(2),.reason-table td:nth-child(2){width:1%;white-space:nowrap}
    .status-label{max-width:none;white-space:nowrap;background:var(--status-bg);color:var(--status-text)}
    .task-date{white-space:nowrap;color:#4F596A;font-size:13px;font-variant-numeric:tabular-nums}
    .task-tag{background:#F0F2F5;color:#4F596A}
    .table-scroll:focus-visible{outline:2px solid #765bb6;outline-offset:-2px}
    [data-status="open"]{--status-accent:#8A75CC;--status-bg:#F0EBFA;--status-text:#563C8F}
    [data-status="dev"]{--status-accent:#6B92D6;--status-bg:#E9F0FC;--status-text:#285493}
    [data-status="recalc"]{--status-accent:#C99345;--status-bg:#FCF1DF;--status-text:#7D4D12}
    [data-status="fix"]{--status-accent:#52A487;--status-bg:#E7F6EF;--status-text:#21664D}
    .reason-name{overflow-wrap:anywhere;font-weight:600}.reason-detail{display:block;color:#686f7c;font-size:13px;margin-top:4px}
    .delta{font-size:12px;white-space:nowrap;border-radius:999px;padding:5px 8px;background:#f0ebfa;color:#5c418f}
    .delta.up{background:#fbeee9;color:#9e4c28}.delta.down{background:#e7f6ef;color:#21664d}
    @media(max-width:780px){.bento{grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-areas:"metrics distribution" "tasks tasks";grid-template-rows:auto}}
    @media(max-width:520px){.shell{width:calc(100% - 28px)}.bento{grid-template-columns:minmax(0,1fr);grid-template-areas:"metrics" "tasks" "distribution"}.card{padding:16px}}
    @media(prefers-reduced-motion:reduce){.button{transition:none}}
    #task-picker :focus-visible{outline:2px solid #765bb6;outline-offset:2px}
    #task-picker{width:min(430px,calc(100% - 32px));max-height:85dvh;padding:18px;border:0;border-radius:20px;color:#1C1E21;background:white}
    #task-picker::backdrop{background:#2b224553}
    .picker-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
    #task-picker button{border:0;border-radius:10px;background:#F0F2F5;padding:8px 10px;font:inherit;color:inherit;cursor:pointer}
    #task-picker button:hover{background:#e8e2f4}
    #task-picker button[aria-pressed=true]{background:#e9e2fa;color:#4e3684;font-weight:650}
    #picker-search-label{display:grid;gap:5px;margin-bottom:10px;font-size:13px}
    #picker-search{width:100%;border:0;border-radius:12px;padding:9px 10px;background:#F0F2F5;color:inherit;font:inherit}
    .picker-sort{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}#picker-options{display:grid;gap:6px}#picker-options button{text-align:left}
    #picker-message:empty{display:none}
  </style>
</head>
<body>
  <header class="shell"><a href="./"><span class="mark">L2</span> Портал L2</a><span>Демо-версия</span></header>
  <main class="shell">
    <a class="back" href="./">← На главную</a>
    <h1 id="tasks-heading">Задачи проекта</h1>
    <p class="subtitle muted" id="tasks-subtitle">Проект DEMO · синтетические данные</p>
    <nav class="task-views" aria-label="Разделы задач">
      <button type="button" data-task-view="project" aria-pressed="true">Задачи проекта</button>
      <button type="button" data-task-view="today" aria-pressed="false">Мои задачи на сегодня</button>
      <button type="button" data-task-view="team" aria-pressed="false">Мои задачи командные</button>
    </nav>
    <label id="task-employee-field" hidden>Демосотрудник <select id="task-employee"></select></label>
    <div class="bento">
      <section class="card metrics" aria-labelledby="metrics-title">
        <h2 id="metrics-title">Сводка по задачам</h2>
        <svg class="card-icon" viewBox="0 0 36 36" aria-hidden="true"><rect width="36" height="36" rx="11" fill="#EFEAFC"/><path d="M11 24v-5m7 5V12m7 12v-8" stroke="#7961B2" stroke-width="2.2" stroke-linecap="round"/></svg>
        <dl><div><dt>Всего</dt><dd id="task-total">—</dd></div><div><dt>Открытые</dt><dd id="task-open">—</dd></div><div><dt>В работе и ожидании</dt><dd id="task-active">—</dd></div></dl>
      </section>
      <section class="card tasks" aria-labelledby="tasks-title">
        <h2 id="tasks-title">Список задач</h2>
        <p class="muted">Тестовые задачи DEMO.</p>
        <div class="table-scroll" tabindex="0" role="region" aria-label="Таблица задач проекта DEMO">
          <table class="reason-table" aria-labelledby="tasks-title">
            <thead><tr><th scope="col">Задача</th><th scope="col" aria-sort="ascending"><button class="sort-column" type="button" data-sort="status" aria-haspopup="dialog">Статус <span aria-hidden="true">↑</span></button></th><th scope="col"><button class="sort-column" type="button" data-sort="tag" aria-haspopup="dialog">Метка <span aria-hidden="true">↕</span></button></th><th scope="col" title="Дата создания"><button class="sort-column" type="button" data-sort="date">Дата <span aria-hidden="true">↕</span></button></th><th scope="col" class="filter-cell"><button type="button" class="reset-filter" id="reset-filters" aria-label="Сбросить фильтры" title="Сбросить фильтры" disabled><svg width="15" height="15" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M3 7a5 5 0 1 1 .8 4.7M3 7V3m0 4h4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button></th></tr></thead>
            <tbody id="reason-list"></tbody>
          </table>
        </div>
        <p id="reason-empty" class="muted" role="status"></p>
      </section>
      <section class="card distribution" aria-labelledby="status-chart-title">
        <h2 id="status-chart-title">Задачи по статусам</h2>
        <div id="reason-chart" class="status-chart" aria-live="polite"></div>
      </section>
    </div>
  </main>
  <dialog id="task-picker" aria-labelledby="picker-title">
    <div class="picker-head"><h2 id="picker-title"></h2><button type="button" id="picker-close">Закрыть</button></div>
    <div class="picker-sort">
      <button type="button" id="picker-asc">По возрастанию ↑</button>
      <button type="button" id="picker-desc">По убыванию ↓</button>
    </div>
    <label id="picker-search-label" hidden>Поиск метки <input id="picker-search" type="search" autocomplete="off"></label>
    <div id="picker-options"></div>
    <p id="picker-message" class="muted" role="status"></p>
  </dialog>
  <script>
    (() => {
      const $ = id => document.getElementById(id);
      const tasks = [
        { id: 'DEMO-101', title: 'Разобрать повторные обращения по интеграции', tag: 'Интеграция', status: 'open', date: '2026-11-17' },
        { id: 'DEMO-102', title: 'Исправить дублирование записей при повторной синхронизации', tag: 'Синхронизация', status: 'dev', date: '2026-11-18' },
        { id: 'DEMO-103', title: 'Пересчитать итог по обращениям за неделю', tag: 'Отчётность', status: 'recalc', date: '2026-11-19' },
        { id: 'DEMO-104', title: 'Проверить исправление ошибки выгрузки отчёта', tag: 'Выгрузка', status: 'fix', date: '2026-11-20' },
        { id: 'DEMO-105', title: 'Уточнить сценарий ошибки доступа к проекту', tag: 'Доступ', status: 'open', date: '2026-11-23' },
        { id: 'DEMO-106', title: 'Убрать ошибку при переключении фильтра', tag: 'Интерфейс', status: 'dev', date: '2026-11-24' },
        { id: 'DEMO-107', title: 'Сверить данные по закрытым обращениям', tag: 'Данные', status: 'recalc', date: '2026-11-25' },
        { id: 'DEMO-108', title: 'Проверить загрузку отчёта после обновления', tag: 'Отчётность', status: 'fix', date: '2026-11-26' },
      ];
      const staffTasks = [
        ['Анна Волкова', ['Сверить сводку по обращениям', 'Подготовить заметки к встрече команды']],
        ['Илья Орлов', ['Проверить журнал синхронизации', 'Описать шаги воспроизведения ошибки']],
        ['Мария Соколова', ['Пересчитать выборку по отчёту', 'Обновить справочник меток']],
        ['Денис Лебедев', ['Проверить выгрузку за неделю', 'Собрать примеры для проверки фикса']],
        ['Ольга Крылова', ['Проверить доступ к демопроекту', 'Обновить инструкцию для команды']],
      ];
      const teamTasks = staffTasks.flatMap(([, titles], employee) => titles.map((title, i) => ({
        id: 'TEAM-' + (101 + employee * 2 + i), title, employee,
        tag: i ? 'Командная работа' : 'Проверка',
        status: i ? ['dev', 'fix', 'recalc'][employee % 3] : 'open',
        date: i ? '2026-11-26' : '2026-11-25',
      })));
      const views = {
        project: ['Задачи проекта', 'Проект DEMO · синтетические данные'],
        today: ['Мои задачи на сегодня', 'Все открытые задачи проекта DEMO'],
        team: ['Мои задачи командные', 'Тестовые задачи выбранного сотрудника'],
      };
      let taskView = 'project';
      const employeeSelect = $('task-employee');
      staffTasks.forEach(([name], i) => employeeSelect.add(new Option(name, i)));
      const viewButtons = document.querySelectorAll('[data-task-view]');
      const labels = {
        open: 'Открытые',
        dev: 'Передано в разработку',
        recalc: 'Перерасчёт',
        fix: 'Ожидаем фикс',
      };
      const order = Object.keys(labels);
      const collator = new Intl.Collator('ru');
      const sortButtons = document.querySelectorAll('.sort-column');
      let sortKey = 'status';
      let direction = 1;
      const storageKey = 'zdrastes.web.demo.project-tasks.v1';
      let saved = {};
      try {
        const stored = JSON.parse(localStorage.getItem(storageKey));
        if (stored && typeof stored === 'object' && !Array.isArray(stored)) saved = stored;
      } catch {}
      const getStatus = task => Object.hasOwn(labels, saved[task.id]) ? saved[task.id] : task.status;
      const tagKey = 'zdrastes.web.demo.project-task-tags.v1';
      const tags = [...new Set([...tasks, ...teamTasks].map(task => task.tag))].sort(collator.compare);
      let savedTags = {};
      try {
        const stored = JSON.parse(localStorage.getItem(tagKey));
        if (stored && typeof stored === 'object' && !Array.isArray(stored)) savedTags = stored;
      } catch {}
      const getTag = task => tags.includes(savedTags[task.id]) ? savedTags[task.id] : task.tag;
      const picker = $('task-picker');
      const search = $('picker-search');
      let editing;
      const filters = { status: '', tag: '' };
      const resetFilters = $('reset-filters');
      function visibleTasks() {
        if (taskView === 'today') return tasks.filter(task => getStatus(task) === 'open');
        if (taskView === 'team') return teamTasks.filter(task => task.employee === Number(employeeSelect.value));
        return tasks;
      }
      function resetTable() {
        filters.status = '';
        filters.tag = '';
        sortKey = 'status';
        direction = 1;
      }
      resetFilters.addEventListener('click', () => {
        resetTable();
        render();
        document.querySelector('[data-sort="status"]').focus({ preventScroll: true });
      });
      function openPicker(field) {
        editing = field;
        $('picker-title').textContent = field === 'tag' ? 'Фильтр по метке' : 'Фильтр по статусу';
        $('picker-search-label').hidden = field !== 'tag';
        search.value = '';
        renderOptions();
        picker.showModal();
        if (field === 'tag') search.focus();
        else $('picker-options').querySelector('[aria-pressed="true"]')?.focus();
      }
      function renderOptions() {
        const field = editing;
        const query = search.value.trim().toLocaleLowerCase('ru');
        const options = field === 'tag' ? tags.map(tag => [tag, tag]) : Object.entries(labels);
        const matches = options.filter(([, title]) => title.toLocaleLowerCase('ru').includes(query));
        const clear = field === 'tag' ? 'Все метки' : 'Все статусы';
        $('picker-options').replaceChildren(...[['', clear], ...matches].map(([value, title]) => {
          const button = document.createElement('button');
          button.type = 'button';
          button.textContent = title;
          button.setAttribute('aria-pressed', String(value === filters[field]));
          button.addEventListener('click', () => {
            filters[field] = value;
            render();
            picker.close();
          });
          return button;
        }));
        $('picker-message').textContent = matches.length ? '' : 'Метки не найдены.';
      }
      function setSort(nextDirection) {
        sortKey = editing;
        direction = nextDirection;
        render();
        picker.close();
      }
      $('picker-asc').addEventListener('click', () => setSort(1));
      $('picker-desc').addEventListener('click', () => setSort(-1));
      $('picker-close').addEventListener('click', () => picker.close());
      search.addEventListener('input', renderOptions);
      picker.addEventListener('close', () => {
        document.querySelector('[data-sort="' + editing + '"]')?.focus({ preventScroll: true });
      });
      function renderChart() {
        const tasks = visibleTasks();
        const counts = { open: 0, dev: 0, recalc: 0, fix: 0 };
        for (const item of tasks) counts[getStatus(item)] += 1;
        $('task-total').textContent = tasks.length;
        $('task-open').textContent = counts.open;
        $('task-active').textContent = tasks.length - counts.open;
        $('reason-chart').replaceChildren(...Object.entries(labels).map(([value, label]) => {
          const row = document.createElement('div');
          row.className = 'status-row';
          row.dataset.status = value;
          const title = document.createElement('span');
          title.textContent = label;
          const track = document.createElement('div');
          track.className = 'status-track';
          track.setAttribute('aria-hidden', 'true');
          const fill = document.createElement('div');
          fill.className = 'status-fill';
          fill.style.width = (tasks.length ? 100 * counts[value] / tasks.length : 0) + '%';
          track.append(fill);
          const count = document.createElement('strong');
          count.textContent = counts[value];
          row.append(title, track, count);
          return row;
        }));
      }
     function render() {
        resetFilters.disabled = !filters.status && !filters.tag && sortKey === 'status' && direction === 1;
        const matches = visibleTasks().filter(item =>
          (!filters.status || getStatus(item) === filters.status) &&
          (!filters.tag || getTag(item) === filters.tag)
        ).sort((a, b) => {
          if (sortKey === 'date') return direction * a.date.localeCompare(b.date);
          if (sortKey === 'tag') return direction * collator.compare(getTag(a), getTag(b));
          return direction * (order.indexOf(getStatus(a)) - order.indexOf(getStatus(b)));
        });
        for (const button of sortButtons) {
          const active = button.dataset.sort === sortKey;
          if (active) button.parentElement.setAttribute('aria-sort', direction === 1 ? 'ascending' : 'descending');
          else button.parentElement.removeAttribute('aria-sort');
          const field = button.dataset.sort;
          const filterValue = filters[field];
          button.querySelector('span').textContent = filterValue ? '•' : active ? (direction === 1 ? '↑' : '↓') : '↕';
          const column = { status: 'Статус', tag: 'Метка', date: 'Дата' }[field];
          button.setAttribute('aria-label', filterValue ? column + ': ' +
            (field === 'tag' ? filterValue : labels[filterValue]) : column);
        }
        $('reason-list').replaceChildren(...matches.map(item => {
          const row = document.createElement('tr');
          const label = document.createElement('th');
          label.scope = 'row';
          label.className = 'reason-name';
          label.textContent = item.title;
          const detail = document.createElement('span');
          detail.className = 'reason-detail';
          detail.textContent = item.id;
          label.append(detail);
          const status = document.createElement('td');
          const value = getStatus(item);
          const badge = document.createElement('span');
          badge.className = 'status-label';
          badge.textContent = labels[value];
          badge.dataset.status = value;
          status.append(badge);
          const tagCell = document.createElement('td');
          const tag = document.createElement('span');
          tag.className = 'task-tag';
          tag.textContent = getTag(item);
          tagCell.append(tag);
          const dateCell = document.createElement('td');
          dateCell.className = 'task-date';
          const date = document.createElement('time');
          date.dateTime = item.date;
          date.textContent = item.date.split('-').reverse().join('.');
          dateCell.append(date);
          const actionCell = document.createElement('td');
          actionCell.className = 'filter-cell';
          row.append(label, status, tagCell, dateCell, actionCell);
          return row;
        }));
        $('reason-empty').textContent = matches.length ? '' : 'Нет задач по выбранным фильтрам.';
      }
      for (const button of sortButtons) {
        button.addEventListener('click', () => {
          const field = button.dataset.sort;
          if (field !== 'date') {
            openPicker(field);
            return;
          }
          direction = sortKey === 'date' ? -direction : 1;
          sortKey = 'date';
          render();
        });
      }
      function showView() {
        const [title, subtitle] = views[taskView];
        $('tasks-heading').textContent = title;
        $('tasks-subtitle').textContent = subtitle;
        $('task-employee-field').hidden = taskView !== 'team';
        for (const button of viewButtons) {
          button.setAttribute('aria-pressed', String(button.dataset.taskView === taskView));
        }
        resetTable();
        renderChart();
        render();
      }
      for (const button of viewButtons) {
        button.addEventListener('click', () => {
          taskView = button.dataset.taskView;
          showView();
        });
      }
      employeeSelect.addEventListener('change', showView);
      showView();
    })();
  </script>
</body>
</html>
