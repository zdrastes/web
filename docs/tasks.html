<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self' 'unsafe-inline'; base-uri 'none'; form-action 'none'">
  <title>Задачи команды · Портал L2</title>
  <link rel="stylesheet" href="css/portal.css">
  <style>
    .tasks-page{padding-top:38px}
    .tasks-page h1{font-size:clamp(32px,6vw,57px)}
    .construction{display:grid;justify-items:center;text-align:center;gap:16px;padding:clamp(28px,7vw,58px) 20px;background:#fff;border:1px solid #e6e0ef;border-radius:24px}
    .construction h2{margin:0;font-size:clamp(20px,4vw,27px)}
    .construction svg{width:80px;height:80px}
  </style>
</head>
<body>
  <header class="shell">
    <a class="logo" href="./"><span class="mark">L2</span> Портал L2</a>
    <span class="top-note">Демо-версия</span>
  </header>
  <main class="shell tasks-page">
    <a class="back" href="./">← На главную</a>
    <h1>Задачи команды</h1>
    <section class="construction" aria-labelledby="construction-title">
      <svg viewBox="0 0 80 80" aria-hidden="true" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect width="80" height="80" rx="22" fill="#FFF2DC"/>
        <path d="M20 63h40M26 59l11-36a3 3 0 0 1 6 0l11 36" stroke="#985B19" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M32 45h16M35 35h10M29 55h22" stroke="#DB922C" stroke-width="4" stroke-linecap="round"/>
      </svg>
      <h2 id="construction-title">Раздел в разработке</h2>
    </section>
  </main>
</body>
</html>
